[deploy]
binary = "track"
pre_build = ["trunk build --release"]
build_features = ["bundle"]

# The host is left to the command line: `kick deploy --to remote --host moore`.
[deploy.profiles.remote]
user = "integration"

# Mirrors the track.service already installed on moore, so an unchanged unit is left alone.
[deploy.systemd]
description = "Track Service"
user = "track"
group = "track"
working_directory = "~"
kill_signal = "SIGINT"
start_limit_interval_sec = "60s"
start_limit_burst = 3
timeout_stop_sec = "5min"
args = ["--bind", "0.0.0.0:3004"]
