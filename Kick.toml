lib_badges = ["-crates.io"]
readme_badges = ["-crates.io"]

[[badges]]
id = "manual"
alt = "manual"
src = "https://img.shields.io/badge/manual-track-b7410e?style=for-the-badge&logo=mdbook&logoColor=white"
href = "https://udoprog.github.io/track/#/manual/"
height = "{{badge_height}}"

[build]
binary = "track"
pre_build = ["trug build --release"]
features = ["bundle"]

[package]
binaries = { exclude = ["api", "e2e", "frontend", "import", "tools"] }

[deploy.systemd]
description = "Track Service"
user = "track"
group = "track"
working_directory = "~"
kill_signal = "SIGINT"
start_limit_interval_sec = "60s"
start_limit_burst = 3
timeout_stop_sec = "5min"
args = ["--bind", "0.0.0.0:3004"]
