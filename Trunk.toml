[build]
target = "crates/frontend/index.html"

# The generated Sass lists and the stylesheet are written by the pre_build hook below;
# ignore them so rewriting them does not retrigger the watcher into a rebuild loop.
[watch]
ignore = [
    "crates/frontend/style/_flags_generated.scss",
    "crates/frontend/style/_icons_generated.scss",
    "crates/frontend/style/main.css",
]

# Regenerate the flag/icon Sass name lists from the vendored SVGs, so they stay in sync
# with `tools vendor` without hand-maintenance, then compile the stylesheet with trug
# (sockel's Sass comes from `pkg:sockel`); index.html links the result. One hook,
# since trunk runs a stage's hooks at the same time.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "cargo run -p tools -- scss && trug css crates/frontend/style/main.scss -o crates/frontend/style/main.css --manifest-path crates/frontend/Cargo.toml"]

[[proxy]]
rewrite = "/ws"
backend = "ws://127.0.0.1:3000/ws"
ws = true

[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:3000/api/"
no_redirect = true
