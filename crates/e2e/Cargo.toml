[package]
name = "e2e"
edition = "2024"
publish = false

# The suite is the package; the library only exists because cargo needs a target.
[lib]
test = false
doctest = false

[dependencies]

[dev-dependencies]
anyhow = "1.0.104"
sqll = { version = "0.14.4", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
# Without `bundle`, which embeds dist/ at compile time: the suite serves the
# frontend yew-e2e builds for the run.
track = { path = "../track", default-features = false }
tracing-subscriber = "0.3.23"
yew-e2e = "0.2.0"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
