[package]
name = "api"
edition = "2024"
publish = false

[features]
sqll = ["dep:sqll", "js"]
js = ["jiff/js"]
rand = ["dep:rand"]
yew = ["dep:yew", "dep:implicit-clone"]

[dependencies]
iso639 = { version = "0.0.0", path = "../iso639" }
iso3166 = { version = "0.0.0", path = "../iso3166" }
locales = { version = "0.0.0", path = "../locales" }

base64 = "0.22.1"
jiff = "0.2.28"
musli-core = { version = "0.1.4", default-features = false, features = ["alloc", "std"] }
musli-web = { version = "0.4.3", features = ["api"] }
serde = { version = "1.0.228", features = ["derive"] }
rand = { version = "0.10.1", optional = true }
sqll = { version = "0.14.3", optional = true }
yew = { version = "0.23.0", optional = true }
implicit-clone = { version = "0.6.0", optional = true }

[dev-dependencies]
serde_json = "1.0.150"
