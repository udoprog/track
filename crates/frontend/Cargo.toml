[package]
name = "frontend"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
api = { path = "../api", features = ["js"] }
iso639 = { path = "../iso639" }

derive_more = { version = "2.1.1", features = ["display"] }
gloo = "0.12.0"
jiff = { version = "0.2.28", features = ["js"] }
jiff-tzdb = "0.1.6"
js-sys = "0.3.99"
musli-web = { version = "0.4.2", default-features = false, features = ["web03", "yew023"] }
tracing = "0.1.44"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.122"
yew = { version = "0.23.0", features = ["csr"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "EventTarget",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Window",
]
