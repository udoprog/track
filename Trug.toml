[build]
target = "crates/frontend/index.html"
# The server embeds dist/ at the repository root.
dist = "dist"

# The generated Sass lists are written by the pre_build hook below; ignore them so
# rewriting them doesn't retrigger the watcher into a rebuild loop. A server run
# from the checkout writes its database and image cache here, and .claude holds
# worktrees; none of them should rebuild the page.
[watch]
ignore = [
    "crates/frontend/style/_flags_generated.scss",
    "crates/frontend/style/_icons_generated.scss",
    "*.db*",
    "image-cache/**",
    ".claude/**",
]

# Regenerate the flag/icon Sass name lists from the vendored SVGs before compiling
# styles, so they stay in sync with `tools vendor` without hand-maintenance.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "tools", "--", "scss"]

[[proxy]]
rewrite = "/ws"
backend = "ws://127.0.0.1:3000/ws"
ws = true

[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:3000/api/"
no_redirect = true
