[package]
name = "track-site"
edition = "2024"
publish = false

[workspace]

[dependencies]
sockel = { version = "0.4.4", default-features = false, features = ["button", "layout", "head", "code-snippet", "card-grid", "tabs"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Clipboard", "Document", "Element", "Location", "Navigator", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }

[build-dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
sockel-build = "0.4.4"

[dev-dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
sockel-build = "0.4.4"
